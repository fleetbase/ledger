name: API Contract (Postman)

# Boots a full Fleetbase stack (published image) and runs the Ledger API Postman
# collection against the live API. Delegates to the reusable workflow in
# fleetbase/fleetbase. Requires org secrets POSTMAN_API_KEY + _GITHUB_AUTH_TOKEN
# (inherited); no-ops until POSTMAN_API_KEY is set.
#
# Pin the workflow and stack fixtures together. This runner installs the branch
# through Composer so its released dependencies, including Core API >=1.6.65,
# replace older versions baked into the published image.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'dev-v*', 'release/v*']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  contract:
    # Laravel 12 release only. Revert this job to what it was before the release once it
    # ships, including the fleetbase pin. The published image is Laravel 10 and its
    # extensions require core-api 1.x, so this branch can only resolve against the whole
    # Laravel 12 train: the `l12` stack builds the image from fleetbase's Laravel 12 branch and
    # links core-api and every extension from their release branches. Point `uses` and
    # `stack-ref` at `main` once fleetbase/fleetbase's contract-stack change merges there.
    uses: fleetbase/fleetbase/.github/workflows/api-contract.yml@ci/contract-stack
    with:
      collections: "Fleetbase Ledger API"
      stack: l12
      stack-ref: ci/contract-stack
      build-from-source: false
      # Without this the run tests the version of fleetbase/ledger-api baked into the
      # published image, not the branch under review. The workflow checks this
      # repository out at the commit under test and swaps it into the container.
      overlay-package: fleetbase/ledger-api
    secrets: inherit
